<form class="flex flex-col gap-5">

<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-text-primary" for="email">E-posta veya Kullanıcı Adı</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary select-none pointer-events-none" style="font-size: 20px;">person</span>
<input class="form-input w-full h-12 rounded-lg border border-[#e5e7eb] bg-[#f9fafb] pl-11 pr-4 text-base text-text-primary placeholder:text-text-secondary focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all dark:bg-[#1a2633] dark:border-[#2d3b4a]" id="email" placeholder="ornek@email.com" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="text-sm font-semibold text-text-primary" for="password">Şifre</label>
<a class="text-xs font-semibold text-primary hover:text-primary/80 hover:underline" href="#">Şifremi Unuttum?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary select-none pointer-events-none" style="font-size: 20px;">lock</span>
<input class="form-input w-full h-12 rounded-lg border border-[#e5e7eb] bg-[#f9fafb] pl-11 pr-12 text-base text-text-primary placeholder:text-text-secondary focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all dark:bg-[#1a2633] dark:border-[#2d3b4a]" id="password" placeholder="********" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-text-secondary hover:text-text-primary transition-colors cursor-pointer flex items-center justify-center" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="mt-4 flex w-full h-12 items-center justify-center rounded-lg bg-primary text-white text-base font-bold tracking-wide hover:bg-primary/90 transition-all shadow-sm hover:shadow-md active:scale-[0.99]">
                            Giriş Yap
                        </button>
</form>
<!-- Divider -->
<div class="relative flex py-2 items-center">
<div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>

<div class="flex gap-3">
